<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Kumasio</title>
      <script type="module" crossorigin src="/assets/home-CJ8AaFQG.js"></script>
      <link rel="modulepreload" crossorigin href="/assets/lib-CTc4_zLY.js">
      <link rel="stylesheet" crossorigin href="/assets/lib-quJTPtzw.css">
      <link rel="stylesheet" crossorigin href="/assets/home-Dt4DocJC.css">
    </head>

    <body>
        <dialog id="set-overview">
            <img id="set-image" src="/assets/not-found-CY0__lx1.png" alt="Set cover image" />

            <h1 id="set-title">Title</h1>
            <span class="set-type" id="set-type">${type}</span>
            <p id="set-description">No description available.</p>

            <hr />
            <div class="overview-actions">
                <!-- todo: maybe add a delete button, more info, etc -->
                <button class="cta" id="practice-this-set">Practice/Play</button>
                <button class="btn" id="edit-this-set">Edit</button>
                <button class="btn" id="overview-close-btn">Close</button>
            </div>
        </dialog>

        <header>
            <h1 id="greeting-header">Good morning</h1>
            <p id="greeting-paragraph">Let's make today productive!</p>
        </header>

        <h3>Pick off where you left off</h3>
        <div class="quiz-grid" id="recentSets"></div>

        <hr />

        <h3>All Quizzes</h3>
        <div class="quiz-grid" id="quizGrid">
            <div id="noQuizzesMsg" style="display: none">No quizzes found. Create a new one!</div>
        </div>

        <div id="devContainer">
            <h2>Dev Panel</h2>
            <p>If you aren't a dev, then <b>get out now.</b></p>

            <hr />

            <button class="btn" id="newDevQuiz">Make a Dev Quiz</button>
            <button class="btn danger" id="devReset">Reset <code>state</code></button>
            <button class="btn" id="debugNotification">Send test notification</button>
            <button class="btn" id="debugInfoToast">Info toast</button>
            <button class="btn" id="debugErrorToast">Error toast</button>

            <hr />

            <button class="btn" id="closeDev">Un-sneeze</button>
        </div>

        <div class="create-options-container hidden">
            <button class="btn create-option-btn" id="newImport">Import</button>
            <button class="btn create-option-btn" id="newFlashcard">Flashcards</button>
            <button class="btn create-option-btn" id="newQuiz">Quiz</button>
        </div>
        <button class="create-btn">Create New...</button>

    </body>
</html>
