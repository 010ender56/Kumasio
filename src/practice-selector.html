<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Practice Selector</title>
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="stylesheet" href="/css/practice-selector.css" />
    </head>

    <body>
        <div class="practice-container">
            <div class="practice-content">
                <div class="practice-pane" id="left-pane">
                    <h1>What do you want to do?</h1>
                    <div class="set-actions">
                        <button class="action-btn cta" id="cram-btn">
                            Cram<br />
                            <small class="button-description">for a test</small>
                        </button>
                        <button class="action-btn btn" id="study-btn" disabled>
                            Study<br />
                            <small class="button-description">using Spaced Repetition</small>
                        </button>
                        <button class="action-btn btn" id="review-btn">
                            Review<br />
                            <small class="button-description">flip through your cards</small>
                        </button>
                    </div>

                    <div class="separator">Other options</div>
                    
                    <div class="set-actions">
                        <button class="action-btn btn" id="take-btn" disabled>
                            Take<br />
                            <small class="button-description">a practice test</small>
                        </button>
                        <button class="action-btn btn" id="play-btn" disabled>
                            Play<br />
                            <small class="button-description">with different games</small>
                        </button>
                    </div>
                </div>
                <div class="practice-pane" id="right-pane">
                    <div class="analytics"></div>
                </div>
            </div>
        </div>

        <script src="/js/practice-selector.js" type="module"></script>
    </body>
</html>
