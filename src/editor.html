<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Editor</title>
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="stylesheet" href="/css/editor.css" />
    </head>

    <body>
        <dialog id="edit-set-dialog">
            <form class="dialog-container" method="dialog">
                <header class="dialog-header">
                    <h3>Edit Set Info</h3>
                    <button type="button" class="icon-btn dialog-close" id="edit-dialog-close" aria-label="Close">×</button>
                </header>

                <div class="uploader-container" id="quiz-info-uploader"></div>

                <div class="field-group">
                    <label for="quiz-title">Title</label>
                    <input type="text" id="quiz-title" maxlength="55" placeholder="Set title" />
                    <small class="field-hint">Up to 55 characters</small>
                </div>

                <div class="field-group">
                    <label for="quiz-desc">Description</label>
                    <textarea
                        id="quiz-desc"
                        placeholder="Describe this set (max 100 characters)"
                        maxlength="100"
                    ></textarea>
                    <p id="char-count" class="char-count">0/100</p>
                </div>

                <div class="field-row">
                    <div class="field-group">
                        <label for="quiz-type">Type</label>
                        <select id="quiz-type">
                            <option value="quiz">Quiz (Answer Questions)</option>
                            <option value="flashcards">Flashcards (Study)</option>
                        </select>
                    </div>
                    <div class="field-group" id="quiz-only-options">
                        <label class="label-normal" for="one-way-quiz">Allow going back</label>
                        <input type="checkbox" id="one-way-quiz" />
                    </div>
                </div>

                <footer class="dialog-actions">
                    <button class="btn danger" id="delete-set" type="button">Delete Set</button>
                    <button class="cta" id="save-quiz-info" type="submit">Save Changes</button>
                </footer>
            </form>
        </dialog>

        <div class="quiz-wrapper">
            <aside class="sidebar">
                <button class="btn" id="edit-set">Edit Info</button>
                <button class="btn" id="preview-set">Preview Set</button>
                <hr />

                <div class="question-list">
                    <!-- Content injected via JS -->
                </div>

                <button class="cta" id="add-question-btn">+ Question</button>
            </aside>

            <section class="builder-panel" id="builder-panel">
                <!-- Content injected via JS -->
            </section>
        </div>

        <script src="/js/editor.js" type="module"></script>
    </body>
</html>
