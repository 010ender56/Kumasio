<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Kumasio</title>
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="stylesheet" href="/css/index.css" />
    </head>

    <body>
        <header>
            <h1 id="greeting-header">Good morning</h1>
            <p id="greeting-paragraph">Let's make today productive!</p>
        </header>

        <h3>Pick off where you left off</h3>
        <div class="quiz-grid" id="recentSets">

        </div>

        <hr />
        
        <h3>All Quizzes</h3>
        <div class="quiz-grid" id="quizGrid">
            <div id="noQuizzesMsg" style="display: none">No quizzes found. Create a new one!</div>
        </div>

        <div id="devContainer">
            <h2>Dev Panel</h2>
            <p>If you aren't a dev, then <b>get out now.</b></p>

            <hr />

            <button class="btn" id="newDevQuiz">Make a Dev Quiz</button>
            <button class="btn danger" id="devReset">Reset <code>state</code></button>
            <button class="btn" id="debugNotification">Send test notification</button>
            <button class="btn" id="debugInfoToast">Info toast</button>
            <button class="btn" id="debugErrorToast">Error toast</button>

            <hr />

            <button class="btn" id="closeDev">Un-sneeze</button>
        </div>

        <div class="create-options-container hidden">
            <button class="btn create-option-btn" id="newImport">Import</button>
            <button class="btn create-option-btn" id="newFlashcard">Flashcards</button>
            <button class="btn create-option-btn" id="newQuiz">Quiz</button>
        </div>
        <button class="create-btn">Create New...</button>

        <script src="/js/index.js" type="module"></script>
    </body>
</html>
